<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
margin:0;
font-family:Segoe UI;
background:#111;
color:white;
}

header{
background:#000;
padding:20px;
text-align:center;
}

header a{
color:white;
text-decoration:none;
margin:15px;
}

.contact{
padding:80px 10%;
display:flex;
justify-content:center;
align-items:center;
}

.form-box{
background:#222;
padding:40px;
border-radius:20px;
width:100%;
max-width:600px;
box-shadow:0 0 25px rgba(255,183,3,.4);
}

h1{
text-align:center;
margin-bottom:30px;
}

input,
textarea{
width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:10px;
}

button{
width:100%;
padding:15px;
background:#ffb703;
border:none;
font-size:18px;
font-weight:bold;
cursor:pointer;
border-radius:10px;
}

button:hover{
background:white;
}

.info{
margin-top:30px;
text-align:center;
}

.info p{
margin:10px 0;
}

</style>
</head>

<body>

<header>
<a href="index.html">Home</a>
<a href="menu.html">Menu</a>
<a href="contact.html">Contact</a>
</header>

<section class="contact">

<div class="form-box">

<h1>Contact Us</h1>

<form>
<input type="text" placeholder="Your Name">
<input type="email" placeholder="Email Address">
<textarea rows="5" placeholder="Message"></textarea>
<button type="submit">Send Message</button>
</form>

<div class="info">
<p><i class="fas fa-phone"></i> +63 912 345 6789</p>
<p><i class="fas fa-envelope"></i> info@restaurant.com</p>
<p><i class="fas fa-location-dot"></i> Quezon City, Philippines</p>
</div>

</div>

</section>

</body>
</html>

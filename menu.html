<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant Menu</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
margin:0;
font-family:Segoe UI;
background:#111;
color:white;
}

header{
background:#000;
padding:20px;
text-align:center;
}

header a{
color:white;
text-decoration:none;
margin:15px;
}

.title{
text-align:center;
padding:50px 20px;
}

.menu{
padding:40px 8%;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:30px;
}

.card{
background:#222;
border-radius:20px;
overflow:hidden;
transition:.4s;
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card-content{
padding:20px;
}

.price{
color:#ffb703;
font-size:22px;
font-weight:bold;
}

</style>
</head>

<body>

<header>
<a href="index.html">Home</a>
<a href="menu.html">Menu</a>
<a href="contact.html">Contact</a>
</header>

<div class="title">
<h1>Our Special Menu</h1>
</div>

<section class="menu">

<div class="card">
<img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38">
<div class="card-content">
<h2>Pizza Supreme</h2>
<p>Loaded with fresh toppings and mozzarella cheese.</p>
<div class="price">$15</div>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1550547660-d9450f859349">
<div class="card-content">
<h2>Classic Burger</h2>
<p>Juicy beef patty with crispy vegetables.</p>
<div class="price">$12</div>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c">
<div class="card-content">
<h2>Healthy Salad</h2>
<p>Fresh organic vegetables and dressing.</p>
<div class="price">$10</div>
</div>
</div>

</section>

</body>
</html>
